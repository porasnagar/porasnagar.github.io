<!-- System Properties / Control Panel icon 32x32 -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" shape-rendering="crispEdges">
  <!-- main gear -->
  <circle cx="16" cy="16" r="8" fill="#808080"/>
  <circle cx="16" cy="16" r="4" fill="#c0c0c0"/>
  <!-- gear teeth -->
  <rect x="14" y="4" width="4" height="5" fill="#808080"/>
  <rect x="14" y="23" width="4" height="5" fill="#808080"/>
  <rect x="4" y="14" width="5" height="4" fill="#808080"/>
  <rect x="23" y="14" width="5" height="4" fill="#808080"/>
  <!-- diagonal teeth -->
  <rect x="6" y="6" width="4" height="4" fill="#808080" transform="rotate(45 8 8)"/>
  <rect x="22" y="6" width="4" height="4" fill="#808080" transform="rotate(45 24 8)"/>
  <rect x="6" y="22" width="4" height="4" fill="#808080" transform="rotate(45 8 24)"/>
  <rect x="22" y="22" width="4" height="4" fill="#808080" transform="rotate(45 24 24)"/>
  <!-- center hole -->
  <circle cx="16" cy="16" r="2" fill="#c0c0c0"/>
</svg>

<!-- DOS Snake icon 32x32 pixel art -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" shape-rendering="crispEdges">
  <rect width="32" height="32" fill="#000"/>
  <!-- snake body (green pixel segments) -->
  <rect x="4" y="16" width="4" height="4" fill="#00aa00"/>
  <rect x="8" y="16" width="4" height="4" fill="#00cc00"/>
  <rect x="12" y="16" width="4" height="4" fill="#00cc00"/>
  <rect x="12" y="12" width="4" height="4" fill="#00cc00"/>
  <rect x="16" y="12" width="4" height="4" fill="#00cc00"/>
  <rect x="20" y="12" width="4" height="4" fill="#00cc00"/>
  <rect x="24" y="12" width="4" height="4" fill="#00ee00"/>
  <!-- snake head -->
  <rect x="24" y="8" width="4" height="4" fill="#00ff00"/>
  <!-- eye -->
  <rect x="26" y="9" width="1" height="1" fill="#fff"/>
  <!-- food (apple) -->
  <rect x="6" y="6" width="4" height="4" fill="#ff0000"/>
  <rect x="7" y="5" width="2" height="2" fill="#009900"/>
</svg>

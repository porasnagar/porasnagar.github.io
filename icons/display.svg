<!-- Display Settings monitor icon 32x32 -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" shape-rendering="crispEdges">
  <!-- monitor body -->
  <rect x="2" y="4" width="28" height="19" fill="#c0c0c0" rx="1"/>
  <rect x="2" y="4" width="28" height="19" fill="none" stroke="#808080" stroke-width="1"/>
  <!-- screen with color gradient -->
  <rect x="4" y="6" width="24" height="15" fill="#008080"/>
  <!-- screen content - colorful display settings preview -->
  <rect x="4" y="6" width="8" height="15" fill="#0000aa"/>
  <rect x="12" y="6" width="8" height="15" fill="#aa0000"/>
  <rect x="20" y="6" width="8" height="15" fill="#00aa00"/>
  <!-- stand -->
  <rect x="13" y="23" width="6" height="4" fill="#999"/>
  <!-- base -->
  <rect x="10" y="27" width="12" height="2" fill="#888"/>
</svg>

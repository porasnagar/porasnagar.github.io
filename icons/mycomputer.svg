<!-- My Computer icon 32x32 Windows 98 style -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" shape-rendering="crispEdges">
  <!-- monitor -->
  <rect x="5" y="3" width="18" height="14" fill="#c0c0c0"/>
  <rect x="5" y="3" width="18" height="14" fill="none" stroke="#808080" stroke-width="1"/>
  <rect x="7" y="5" width="14" height="10" fill="#008080"/>
  <!-- monitor base -->
  <rect x="11" y="17" width="6" height="3" fill="#999"/>
  <rect x="8" y="20" width="12" height="2" fill="#888"/>
  <!-- tower -->
  <rect x="24" y="8" width="7" height="16" fill="#c0c0c0"/>
  <rect x="24" y="8" width="7" height="16" fill="none" stroke="#808080" stroke-width="1"/>
  <!-- floppy drive -->
  <rect x="25" y="11" width="5" height="3" fill="#999"/>
  <rect x="26" y="12" width="3" height="1" fill="#666"/>
  <!-- CD drive -->
  <rect x="25" y="16" width="5" height="3" fill="#999"/>
  <rect x="26" y="17" width="3" height="1" fill="#666"/>
  <!-- power LED -->
  <rect x="26" y="9" width="2" height="1" fill="#00ff00"/>
</svg>

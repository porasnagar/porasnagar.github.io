<!-- MS-DOS terminal icon 32x32 -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" shape-rendering="crispEdges">
  <!-- monitor body -->
  <rect x="2" y="3" width="28" height="20" fill="#1a1a1a" rx="1"/>
  <rect x="2" y="3" width="28" height="20" fill="none" stroke="#666" stroke-width="1"/>
  <!-- screen -->
  <rect x="4" y="5" width="24" height="16" fill="#000080"/>
  <!-- cursor -->
  <rect x="6" y="7" width="7" height="7" fill="#ffffff" opacity="0.9"/>
  <!-- C:\ prompt text (simplified) -->
  <rect x="6" y="15" width="4" height="1" fill="#aaaaaa"/>
  <rect x="6" y="17" width="6" height="1" fill="#aaaaaa"/>
  <!-- blinking cursor line -->
  <rect x="13" y="17" width="4" height="1" fill="#ffffff"/>
  <!-- stand -->
  <rect x="13" y="23" width="6" height="4" fill="#888"/>
  <!-- base -->
  <rect x="9" y="27" width="14" height="2" fill="#666"/>
</svg>

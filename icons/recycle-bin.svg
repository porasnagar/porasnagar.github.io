<!-- Recycle Bin (empty) icon 32x32 Windows 98 style -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" shape-rendering="crispEdges">
  <!-- bin body -->
  <rect x="7" y="12" width="18" height="17" fill="#c0c0c0"/>
  <rect x="7" y="12" width="18" height="17" fill="none" stroke="#808080" stroke-width="1"/>
  <!-- bin ridges -->
  <rect x="10" y="14" width="2" height="13" fill="#999"/>
  <rect x="15" y="14" width="2" height="13" fill="#999"/>
  <rect x="20" y="14" width="2" height="13" fill="#999"/>
  <!-- lid -->
  <rect x="5" y="9" width="22" height="3" fill="#c0c0c0"/>
  <rect x="5" y="9" width="22" height="3" fill="none" stroke="#808080" stroke-width="1"/>
  <!-- handle -->
  <rect x="13" y="6" width="6" height="4" fill="none" stroke="#808080" stroke-width="1"/>
  <!-- recycle arrows (simplified) -->
  <path d="M11 20 L16 14 L21 20 L18 20 L18 25 L14 25 L14 20 Z" fill="none" stroke="#4488cc" stroke-width="1"/>
</svg>

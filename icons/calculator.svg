<!-- Calculator icon 32x32 -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" shape-rendering="crispEdges">
  <!-- body -->
  <rect x="5" y="3" width="22" height="26" fill="#c0c0c0" rx="1"/>
  <rect x="5" y="3" width="22" height="26" fill="none" stroke="#808080" stroke-width="1"/>
  <!-- display -->
  <rect x="8" y="6" width="16" height="7" fill="#99cc44"/>
  <rect x="8" y="6" width="16" height="7" fill="none" stroke="#808080" stroke-width="0.5"/>
  <!-- display number -->
  <rect x="16" y="8" width="6" height="3" fill="#669900"/>
  <!-- buttons row 1 -->
  <rect x="8" y="16" width="4" height="3" fill="#dfdfdf"/>
  <rect x="14" y="16" width="4" height="3" fill="#dfdfdf"/>
  <rect x="20" y="16" width="4" height="3" fill="#dfdfdf"/>
  <!-- buttons row 2 -->
  <rect x="8" y="21" width="4" height="3" fill="#dfdfdf"/>
  <rect x="14" y="21" width="4" height="3" fill="#dfdfdf"/>
  <rect x="20" y="21" width="4" height="3" fill="#ff9966"/>
  <!-- = button -->
  <rect x="8" y="26" width="4" height="3" fill="#dfdfdf"/>
  <rect x="14" y="26" width="10" height="3" fill="#0000cc"/>
</svg>

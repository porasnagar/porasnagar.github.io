<!-- GitHub Octocat pixel art icon 32x32 -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" shape-rendering="crispEdges">
  <rect width="32" height="32" fill="#24292e"/>
  <!-- body -->
  <rect x="9" y="14" width="14" height="11" fill="white"/>
  <!-- head -->
  <rect x="10" y="7" width="12" height="10" fill="white"/>
  <rect x="9" y="8" width="14" height="8" fill="white"/>
  <!-- eyes -->
  <rect x="12" y="10" width="2" height="2" fill="#24292e"/>
  <rect x="18" y="10" width="2" height="2" fill="#24292e"/>
  <!-- ears -->
  <rect x="8" y="7" width="3" height="3" fill="white"/>
  <rect x="21" y="7" width="3" height="3" fill="white"/>
  <rect x="8" y="6" width="3" height="2" fill="white"/>
  <rect x="21" y="6" width="3" height="2" fill="white"/>
  <!-- arms -->
  <rect x="5" y="15" width="4" height="6" fill="white"/>
  <rect x="23" y="15" width="4" height="6" fill="white"/>
  <!-- legs -->
  <rect x="10" y="25" width="4" height="4" fill="white"/>
  <rect x="18" y="25" width="4" height="4" fill="white"/>
  <!-- tail -->
  <rect x="24" y="18" width="4" height="3" fill="white"/>
  <rect x="25" y="21" width="3" height="3" fill="white"/>
</svg>

<!-- Email / Outlook Express icon 32x32 -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" shape-rendering="crispEdges">
  <!-- envelope body -->
  <rect x="3" y="8" width="26" height="18" fill="#ffcc00"/>
  <rect x="3" y="8" width="26" height="18" fill="none" stroke="#333" stroke-width="1"/>
  <!-- envelope flap diagonal lines -->
  <line x1="3" y1="8" x2="16" y2="18" stroke="#cc8800" stroke-width="1.5"/>
  <line x1="29" y1="8" x2="16" y2="18" stroke="#cc8800" stroke-width="1.5"/>
  <!-- bottom folds -->
  <line x1="3" y1="26" x2="12" y2="18" stroke="#cc8800" stroke-width="1.5"/>
  <line x1="29" y1="26" x2="20" y2="18" stroke="#cc8800" stroke-width="1.5"/>
  <!-- letter inside -->
  <rect x="8" y="12" width="16" height="10" fill="white" stroke="#aaa" stroke-width="0.5"/>
  <rect x="10" y="14" width="12" height="1" fill="#666"/>
  <rect x="10" y="16" width="10" height="1" fill="#666"/>
  <rect x="10" y="18" width="8" height="1" fill="#666"/>
</svg>
